name: Release

# Runs only on your Mac. Triggered by pushing a version tag, which requires
# write access to the repo (and is further limited by the tag ruleset), so
# no outside code can reach the self-hosted runner through this workflow.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, publish
    # Only the real repo, only from a v* tag: forks and branches never reach the Mac.
    if: github.repository == 'ordino-app/ordino' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, ordino]
    # Protected environment, limited to v* tags (scripts/setup-github.sh).
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Test before shipping
        run: swift test --parallel

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          # Public repo that hosts the Sparkle appcast and update archives. Pushed
          # with the deploy key in ~/.config/ordino on the runner Mac.
          UPDATES_REPO: ${{ vars.UPDATES_REPO }}
        run: scripts/release.sh "$TAG"
