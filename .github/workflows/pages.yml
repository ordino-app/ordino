name: Website

# Deploys web/ to GitHub Pages (https://ordino-app.github.io/ordino/). The repo is
# private; the site is public. Runs on a small GitHub-hosted Linux runner: the
# official Pages artifact action needs GNU tar, which the Mac runner doesn't
# have, and a deploy takes well under a minute of the plan's included minutes.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site (no build artefacts or review files)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.taste-skill' --exclude 'shots' --exclude '*.md' --exclude 'names.json' \
            --exclude '.DS_Store' --exclude 'media/*.png' \
            web/ _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub sometimes doesn't list a freshly uploaded artifact yet ("No artifacts named github-pages"),
      # which failed three deploys in a row in Nov 2026. Give it a moment, and retry once after a longer pause.
      - name: Let GitHub register the upload
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
