name: PR title

# Squash-merged PR titles become commit messages and drive the changelog,
# so they must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    # No checkout, only reads the title, so it is cheap anywhere. Runs on your
    # Mac when CI_RUNNER is set (private repos pay for hosted minutes).
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","macOS","ARM64","ordino"]') || 'ubuntu-latest' }}
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'feat(engine): add bsp layout' (Conventional Commits)."
            exit 1
          fi
